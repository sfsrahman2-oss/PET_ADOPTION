{% extends "base.html" %}
{% block title %}Adopt {{ pet.name }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8 col-lg-6">
  <div class="card shadow-sm"><div class="card-body">
    <h3 class="mb-3">Adoption Application for {{ pet.name }}</h3>
    <form method="post" novalidate>{% csrf_token %}
      {% include "_form.html" %}
      <button class="btn btn-success w-100">Submit Application</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
